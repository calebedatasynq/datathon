<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Agente Empresarial · BB Seguros</title>
  <meta name="description" content="Agente de vendas do Seguro Empresarial BB Seguros: plano personalizado com cláusulas citadas e decisões explicáveis.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <!-- taste-skill-ignore: Plex Mono só nos ids --><link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/estatico/estilo.css">
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='6' fill='%23fcfc30'/%3E%3Cpath d='M12 5l6 2.4v4.3c0 3.6-2.5 6.3-6 7.3-3.5-1-6-3.7-6-7.3V7.4z' fill='%23002555'/%3E%3C/svg%3E">
</head>
<body>
<div class="moldura">
  <aside class="lateral" id="lateral" aria-label="Navegação">
    <div class="marca">
      <svg class="marca-simbolo" viewBox="0 0 24 24" aria-hidden="true">
        <rect width="24" height="24" rx="6" fill="var(--marca)"/>
        <path d="M12 5l6 2.4v4.3c0 3.6-2.5 6.3-6 7.3-3.5-1-6-3.7-6-7.3V7.4z" fill="var(--primary)"/>
        <path d="M9.2 12.1l2 2 3.8-4" fill="none" stroke="var(--marca)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
      <div>
        <p class="marca-nome">Agente Empresarial</p>
        <p class="marca-escopo">BB Seguros</p>
      </div>
      <button class="fechar-menu" id="fechar-menu" aria-label="Fechar menu">
        <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M4 4l8 8M12 4l-8 8"/></svg>
      </button>
    </div>

    <nav class="nav">
      <p class="grupo" id="g-personas">Clientes da demonstração</p>
      <ul class="lista" id="lista-personas" aria-labelledby="g-personas"></ul>

      <label class="grupo" for="outro-cliente">Outro cliente da base</label>
      <select id="outro-cliente" class="seletor"></select>

      <p class="grupo" id="g-auditoria">Auditoria</p>
      <ul class="lista" aria-labelledby="g-auditoria">
        <li><button class="nav-item" id="abrir-gravacoes" aria-expanded="false" aria-controls="lista-gravacoes">
          <svg class="nav-icone" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6"/><path d="M8 4.8V8l2.2 1.4"/></svg>
          <span>Conversas gravadas</span>
        </button></li>
      </ul>
      <ul class="lista gravacoes" id="lista-gravacoes" hidden></ul>
    </nav>

    <div class="rodape-lateral" id="saude">
      <p class="saude-linha"><span class="ponto" aria-hidden="true"></span><span id="saude-texto">Conectando…</span></p>
      <p class="evento">Datathon BB Seguros × Ibmec</p>
    </div>
  </aside>

  <header class="topo">
    <button class="abrir-menu" id="abrir-menu" aria-label="Abrir menu">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M2.5 4.5h11M2.5 8h11M2.5 11.5h11"/></svg>
    </button>
    <p class="escopo"><span class="escopo-produto">Seguro Empresarial <span aria-hidden="true">/</span> </span><span id="escopo-cliente">Atendimento assistido</span></p>
    <p class="modo" id="modo"><span class="ponto" aria-hidden="true"></span><span id="modo-texto">Ao vivo</span></p>
  </header>

  <main class="folha">
    <section class="conversa" aria-labelledby="titulo">
      <div class="titulo-linha">
        <h1 id="titulo">Carregando cliente…</h1>
        <span class="chip-id" id="cliente-id"></span>
        <div class="acoes">
          <button class="botao secundario so-celular" id="ver-plano" aria-controls="detalhes" aria-expanded="false">Ver plano</button>
          <button class="botao secundario" id="nova">Nova conversa</button>
        </div>
      </div>
      <p class="subtitulo" id="subtitulo"></p>

      <div class="mensagens" id="mensagens" aria-live="polite"></div>

      <div class="sugestoes" id="sugestoes" aria-label="Mensagens de exemplo"></div>
      <form class="compositor" id="compositor">
        <label for="entrada" class="vh">Mensagem do cliente</label>
        <textarea id="entrada" rows="1" placeholder="Escreva como o cliente escreveria…" autocomplete="off"></textarea>
        <button type="submit" class="botao primario" id="enviar">Enviar</button>
      </form>
    </section>

    <aside class="detalhes" id="detalhes" aria-label="Plano personalizado">
      <button class="botao secundario so-celular fechar-detalhes" id="fechar-detalhes">Voltar à conversa</button>
      <div id="detalhes-conteudo"></div>
    </aside>
  </main>
</div>

<div class="popover" id="popover" role="dialog" aria-modal="false" hidden></div>
<script src="/estatico/app.js"></script>
</body>
</html>
